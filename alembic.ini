# Alembic config for heat-controller.
#
# sqlalchemy.url here is a placeholder — env.py overrides it at runtime
# from heatctl.config.settings (HEATCTL_DATABASE_URL). Kept plausible so
# `alembic` CLI commands run from this directory work without extra
# env setup.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = postgresql://heatctl:heatctl@localhost:5432/heatctl

# Plain numeric revision IDs (0001, 0002, ...) instead of the default
# random hex -- keeps versions/ sortable and PR diffs obvious.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
