server {
    listen 80;

    # Static SPA assets, with client-side routing fallback.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Reverse-proxy API + WebSocket traffic to the backend `app` service
    # so the browser only ever talks to this one origin (no CORS needed).
    location ~ ^/(devices|tags|healthz) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
