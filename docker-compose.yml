services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
        PIP_EXTRA_INDEX_URL: https://pypi.org/simple/
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - HEATCTL_DATABASE_URL=postgresql+asyncpg://heatctl:heatctl@db:5432/heatctl
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=heatctl
      - POSTGRES_PASSWORD=heatctl
      - POSTGRES_DB=heatctl
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heatctl -d heatctl"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
