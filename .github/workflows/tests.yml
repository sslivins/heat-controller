name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goodhvac
          POSTGRES_PASSWORD: goodhvac
          POSTGRES_DB: goodhvac
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodhvac -d goodhvac"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt ruff mypy

      - name: Lint (ruff)
        run: ruff check goodhvac tests

      - name: Type-check (mypy)
        run: mypy goodhvac

      - name: Alembic migrations up to date
        env:
          GOODHVAC_DATABASE_URL: postgresql+asyncpg://goodhvac:goodhvac@localhost:5432/goodhvac
        run: |
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest -q --cov=goodhvac --cov-report=term-missing --cov-fail-under=85
